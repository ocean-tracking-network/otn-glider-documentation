site_name: OTN Glider Documentation
site_url: https://ocean-tracking-network.github.io/otn-glider-documentation/

repo_url: https://github.com/ocean-tracking-network/otn-glider-documentation
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - content.tabs

nav:
  - Home: index.md
  - Sensor Tracker:
      - Overview: sensor-tracker/index.md
      - Metadata records: sensor-tracker/metadata-records.md
      - Metadata lifecycle: sensor-tracker/metadata-lifecycle.md
      - Architecture: sensor-tracker/architecture.md
  - Glider Data Pipeline V1:
      - Overview: gdp/gdp.md
      - Data products: gdp/data-products.md
      - Processing lifecycle: gdp/processing-lifecycle.md
      - Architecture: gdp/architecture.md
  - Glider Data Pipeline V2:
      - Overview: gdpv2/gdpv2.md
      - Data products: gdpv2/data-products.md
      - Processing lifecycle: gdpv2/processing-lifecycle.md
      - Architecture: gdpv2/architecture.md
  - WGMS Retrieval:
      - Overview: wgms-retrieval/index.md
      - Report files: wgms-retrieval/report-files.md
      - Retrieval and review lifecycle: wgms-retrieval/retrieval-review-lifecycle.md
      - Architecture: wgms-retrieval/architecture.md

plugins:
  - search

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - footnotes
  - tables
  - attr_list
  - def_list
  - pymdownx.details
  - pymdownx.emoji
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
