<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1975" viewBox="0 0 1200 1975" role="img" aria-labelledby="title desc">
<title id="title">GDP2 Slocum data flow</title>
<desc id="desc">Sensor Tracker metadata and selected Slocum binary files feed GDP2 conversion or reuse. A time-series NetCDF proceeds through diagnostics and profile or delayed mission file preparation. Optional ERDDAP publication copies files, assembles datasets.xml, and requests reload when needed.</desc>
